name: Production database migration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('migration-check-{0}', github.event.pull_request.number) || 'production-database-migration' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate production database
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Register production migration check
        if: github.event_name == 'pull_request'
        run: echo "Production migrations run only after this change reaches main."

      - name: Check out repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        if: github.event_name != 'pull_request'
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Verify production credentials
        if: github.event_name != 'pull_request'
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not configured."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not configured."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "SUPABASE_PROJECT_ID is not configured."; exit 1; }

      - name: Link production database
        if: github.event_name != 'pull_request'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --linked --dry-run --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --linked --yes --password "$SUPABASE_DB_PASSWORD"
